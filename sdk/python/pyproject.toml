[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "provableio"
version = "0.1.0"
description = "Official Python SDK for the Provable.io provably-fair random number API"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Provable.io", email = "support@provable.io" }]
keywords = ["provable", "random", "rng", "commit-reveal", "openapi", "sdk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.25,<1",
  "typing-extensions>=4.5; python_version < '3.11'",
]

[project.urls]
Homepage = "https://provable.io/api-docs"
Documentation = "https://provable.io/api-docs"
Repository = "https://github.com/provableio/provable-core"
Issues = "https://github.com/provableio/provable-core/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/provableio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
